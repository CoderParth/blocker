version: 2
project_name: blocker
before:
  hooks:
    - go mod tidy
builds:
  - id: blocker
    main: .
    binary: blocker
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - id: blocker
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    formats: [tar.gz]
checksum:
  name_template: "checksums.txt"
release:
  github:
    owner: parthsigdel
    name: blocker
